version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ragtrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ragtrack_password}
      POSTGRES_DB: ragtrack
    volumes:
      - rag-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY}
      - API_KEY=${API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - USE_LOCAL_LLM=${USE_LOCAL_LLM:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://ragtrack:${DB_PASSWORD:-ragtrack_password}@db:5432/ragtrack
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    volumes:
      - rag-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  rag-data:
    driver: local
  rag-db-data:
    driver: local